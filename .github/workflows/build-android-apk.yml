name: Build Android APK

on:
  # Manual trigger via GitHub UI (Actions → Build Android APK → Run workflow)
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      tenant_slug:
        description: "Tenant slug (default 'gnr' = main depot). Contoh: tirtaputra"
        required: false
        default: "gnr"
        type: string
      tenant_name:
        description: "Nama tampilan depot (dipakai untuk app name). Kalau kosong = default GNR"
        required: false
        default: ""
        type: string
      tenant_url:
        description: "URL server tenant. Kalau kosong = auto https://depot-<slug>.genster.my.id"
        required: false
        default: ""
        type: string

  # Auto-build kalau push ke main dan ada perubahan Capacitor/Android
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Show Node & npm versions
        run: |
          node --version
          npm --version

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Verify Android SDK installed
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/platforms/ || echo "no platforms yet"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | head -30

      # ===== TENANT CUSTOMIZATION =====
      # Kalau tenant_slug != 'gnr', patch capacitor.config.ts + android/app/build.gradle
      # untuk unique appId + server.url. Ini memungkinkan multi-tenant APK dari 1
      # codebase — setiap tenant dapat APK dengan appId sendiri (misal
      # com.genster.depotair.tirtaputra) supaya bisa co-exist di HP yang sama.
      - name: Configure tenant-specific build
        id: tenant
        env:
          TENANT_SLUG: ${{ github.event.inputs.tenant_slug || 'gnr' }}
          TENANT_NAME: ${{ github.event.inputs.tenant_name || '' }}
          TENANT_URL: ${{ github.event.inputs.tenant_url || '' }}
        run: |
          if [[ "$TENANT_SLUG" == "gnr" || -z "$TENANT_SLUG" ]]; then
            echo "Main depot GNR build — no customization"
            echo "final_slug=gnr" >> "$GITHUB_OUTPUT"
            echo "final_app_id=com.genster.depotair" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Validate slug format
          if [[ ! "$TENANT_SLUG" =~ ^[a-z][a-z0-9-]{2,30}$ ]]; then
            echo "ERROR: slug harus lowercase, 3-30 char, a-z 0-9 dash"
            exit 1
          fi

          # Compute derived values
          APP_ID="com.genster.depotair.${TENANT_SLUG//-/_}"
          if [[ -z "$TENANT_NAME" ]]; then
            APP_NAME="Depot ${TENANT_SLUG^}"
          else
            APP_NAME="$TENANT_NAME"
          fi
          if [[ -z "$TENANT_URL" ]]; then
            SERVER_URL="https://depot-${TENANT_SLUG}.genster.my.id"
          else
            SERVER_URL="$TENANT_URL"
          fi

          echo "Tenant customization:"
          echo "  Slug     : $TENANT_SLUG"
          echo "  App ID   : $APP_ID"
          echo "  App Name : $APP_NAME"
          echo "  Server   : $SERVER_URL"

          # Extract host from URL for allowNavigation
          SERVER_HOST=$(echo "$SERVER_URL" | sed -E 's|^https?://||; s|/.*$||')

          # Patch capacitor.config.ts
          sed -i "s|appId: \"com.genster.depotair\"|appId: \"${APP_ID}\"|g" capacitor.config.ts
          sed -i "s|appName: \"Depot Air Minum GNR\"|appName: \"${APP_NAME}\"|g" capacitor.config.ts
          sed -i "s|url: \"https://depot.genster.my.id\"|url: \"${SERVER_URL}\"|g" capacitor.config.ts
          sed -i "s|\"depot.genster.my.id\"|\"${SERVER_HOST}\"|g" capacitor.config.ts

          # Patch android/app/build.gradle applicationId + namespace
          sed -i "s|applicationId \"com.genster.depotair\"|applicationId \"${APP_ID}\"|g" android/app/build.gradle
          sed -i "s|namespace = \"com.genster.depotair\"|namespace = \"${APP_ID}\"|g" android/app/build.gradle
          sed -i "s|namespace \"com.genster.depotair\"|namespace \"${APP_ID}\"|g" android/app/build.gradle

          # Patch AndroidManifest deep link host
          sed -i "s|android:host=\"depot.genster.my.id\"|android:host=\"${SERVER_HOST}\"|g" android/app/src/main/AndroidManifest.xml

          # Rename Java package directory + update MainActivity
          OLD_PKG_PATH="android/app/src/main/java/com/genster/depotair"
          NEW_PKG_PATH="android/app/src/main/java/${APP_ID//./\/}"
          mkdir -p "$(dirname "$NEW_PKG_PATH")"
          mv "$OLD_PKG_PATH" "$NEW_PKG_PATH"
          sed -i "s|package com.genster.depotair;|package ${APP_ID};|g" "${NEW_PKG_PATH}/MainActivity.java"

          # Show diff summary
          echo "=== Patched files ==="
          grep -E "appId|appName|server.url" capacitor.config.ts | head -5
          grep -E "applicationId|namespace" android/app/build.gradle | head -5

          echo "final_slug=${TENANT_SLUG}" >> "$GITHUB_OUTPUT"
          echo "final_app_id=${APP_ID}" >> "$GITHUB_OUTPUT"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      # ===== DEBUG BUILD =====
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List build outputs (debug)
        if: ${{ always() && github.event.inputs.build_type != 'release' }}
        run: |
          echo "=== APK outputs ==="
          find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "no APK found"
          echo "=== Build reports ==="
          ls -la android/app/build/reports/ 2>/dev/null || echo "no reports dir"

      - name: Rename Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        env:
          TENANT_SLUG: ${{ steps.tenant.outputs.final_slug }}
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "output/depot-${TENANT_SLUG}-debug-v$(date +%Y%m%d-%H%M).apk"

      - name: Upload Debug APK artifact
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: depot-${{ steps.tenant.outputs.final_slug }}-debug-apk
          path: output/*.apk
          retention-days: 30

      # ===== RELEASE BUILD (signed) =====
      - name: Decode Keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/depot-release.keystore

      - name: Build Release APK (signed)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/app/depot-release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Build Release AAB (Play Store bundle)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/app/depot-release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Rename Release outputs
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          TENANT_SLUG: ${{ steps.tenant.outputs.final_slug }}
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk \
            "output/depot-${TENANT_SLUG}-release-v$(date +%Y%m%d-%H%M).apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "output/depot-${TENANT_SLUG}-release-v$(date +%Y%m%d-%H%M).aab"

      - name: Upload Release artifacts
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: depot-${{ steps.tenant.outputs.final_slug }}-release
          path: output/*
          retention-days: 90

      - name: Cleanup keystore
        if: ${{ always() && github.event.inputs.build_type == 'release' }}
        run: rm -f android/app/depot-release.keystore
