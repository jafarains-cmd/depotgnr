name: Build Android APK

on:
  # Manual trigger via GitHub UI (Actions → Build Android APK → Run workflow)
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

  # Auto-build kalau push ke main dan ada perubahan Capacitor/Android
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Show Node & npm versions
        run: |
          node --version
          npm --version

      - name: Install npm dependencies
        # Pakai npm install (bukan ci) supaya toleran terhadap optional
        # platform-specific deps yang beda antara Windows local dan Linux CI
        # (mis. @emnapi/*, esbuild native binaries).
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      # ===== DEBUG BUILD =====
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/depot-air-gnr-debug-v$(date +%Y%m%d-%H%M).apk

      - name: Upload Debug APK artifact
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: depot-air-gnr-debug-apk
          path: output/*.apk
          retention-days: 30

      # ===== RELEASE BUILD (signed) =====
      # Butuh GitHub Secrets:
      #   ANDROID_KEYSTORE_BASE64    — keystore .jks di-encode base64
      #   ANDROID_KEYSTORE_PASSWORD  — password keystore
      #   ANDROID_KEY_ALIAS          — alias key
      #   ANDROID_KEY_PASSWORD       — password key
      - name: Decode Keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/depot-release.keystore

      - name: Build Release APK (signed)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/app/depot-release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Build Release AAB (Play Store bundle)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/app/depot-release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Rename Release outputs
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/depot-air-gnr-release-v$(date +%Y%m%d-%H%M).apk
          cp android/app/build/outputs/bundle/release/app-release.aab output/depot-air-gnr-release-v$(date +%Y%m%d-%H%M).aab

      - name: Upload Release artifacts
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: depot-air-gnr-release
          path: output/*
          retention-days: 90

      - name: Cleanup keystore
        if: ${{ always() && github.event.inputs.build_type == 'release' }}
        run: rm -f android/app/depot-release.keystore
